[package]
name = "meuexemplo-repository"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres", 
    "chrono",
    "uuid",
    "macros",
    "migrate",
    "rust_decimal"
] }

# Async trait support
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Decimal numbers (equivalent to pgtype.Numeric)
rust_decimal = { version = "1.0", features = ["serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
hyper = { version = "1.0", features = ["full"] }

[dev-dependencies]
# Testing
tokio-test = "0.4"
tower-test = "0.4"